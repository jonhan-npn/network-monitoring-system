# Needed for the Upgrade header mapping used below (SignalR websockets vs long-polling)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream for the ASP.NET Core API container (docker-compose service name: api)
upstream netmon_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Angular SPA ----
    # Any route that isn't a real static file falls back to index.html
    # so Angular's client-side router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed build artifacts aggressively; index.html stays uncached.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- REST API ----
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://netmon_api/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ---- SignalR hub (live ping/status updates) ----
    # WebSockets need the Upgrade/Connection headers explicitly forwarded,
    # and a long read timeout since the hub connection is long-lived.
    location /hubs/ {
        proxy_pass http://netmon_api/hubs/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Health check for docker-compose / load balancers ----
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
