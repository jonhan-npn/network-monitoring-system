apiVersion: 1

providers:
  - name: "NetworkMonitor"
    orgId: 1
    folder: "Network Monitor"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Any dashboard JSON exported and dropped here gets auto-loaded.
      path: /etc/grafana/provisioning/dashboards/json
