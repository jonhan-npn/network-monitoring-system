# Docker Compose for the full stack: PostgreSQL + API + Worker + frontend (Nginx).
# All configuration comes from .env; see .env.example.

services:
  postgres:
    image: postgres:16-alpine
    container_name: netmonitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - netmonitor-net

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: netmonitor-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      Monitoring__PingIntervalSeconds: ${PING_INTERVAL_SECONDS}
      Monitoring__SnmpPollIntervalSeconds: ${SNMP_POLL_INTERVAL_SECONDS}
      Monitoring__PingTimeoutMs: ${PING_TIMEOUT_MS}
      Monitoring__OfflineThreshold: ${OFFLINE_THRESHOLD}
      Monitoring__HistoryRetentionDays: ${HISTORY_RETENTION_DAYS}
      # init.sql owns the day-zero schema; there are no EF migrations yet, so
      # running MigrateAsync on startup just produces a noisy history-table error.
      Database__MigrateOnStartup: "false"
      # Shared secret the Worker presents to /internal/notifications/*.
      Realtime__InternalSecret: ${REALTIME_INTERNAL_SECRET}
    ports:
      - "${API_PORT:-5000}:8080"
    networks:
      - netmonitor-net

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: netmonitor-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Monitoring__PingIntervalSeconds: ${PING_INTERVAL_SECONDS}
      Monitoring__SnmpIntervalSeconds: ${SNMP_POLL_INTERVAL_SECONDS}
      Monitoring__SshInventoryIntervalMinutes: ${SSH_INVENTORY_INTERVAL_MINUTES}
      Monitoring__RetentionDays: ${HISTORY_RETENTION_DAYS}
      Alerts__Smtp__Host: ${SMTP_HOST}
      Alerts__Smtp__Port: ${SMTP_PORT}
      Alerts__Smtp__Username: ${SMTP_USER}
      Alerts__Smtp__Password: ${SMTP_PASSWORD}
      Alerts__Smtp__FromAddress: ${SMTP_FROM}
      Alerts__Telegram__BotToken: ${TELEGRAM_BOT_TOKEN}
      Realtime__InternalApiBaseUrl: http://api:8080
      Realtime__InternalSecret: ${REALTIME_INTERNAL_SECRET}
    networks:
      - netmonitor-net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: netmonitor-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - netmonitor-net

networks:
  netmonitor-net:
    driver: bridge

volumes:
  postgres_data: