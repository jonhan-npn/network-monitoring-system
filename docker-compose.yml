version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: netmonitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - netmonitor-net

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: netmonitor-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      MonitoringOptions__PingIntervalSeconds: ${PING_INTERVAL_SECONDS}
      MonitoringOptions__SnmpPollIntervalSeconds: ${SNMP_POLL_INTERVAL_SECONDS}
      MonitoringOptions__SshInventoryIntervalMinutes: ${SSH_INVENTORY_INTERVAL_MINUTES}
    ports:
      - "${API_PORT}:8080"
    networks:
      - netmonitor-net

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: netmonitor-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      PING_INTERVAL_SECONDS: ${PING_INTERVAL_SECONDS}
      SNMP_POLL_INTERVAL_SECONDS: ${SNMP_POLL_INTERVAL_SECONDS}
      SSH_INVENTORY_INTERVAL_MINUTES: ${SSH_INVENTORY_INTERVAL_MINUTES}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    networks:
      - netmonitor-net

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    container_name: netmonitor-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - netmonitor-net

networks:
  netmonitor-net:
    driver: bridge

volumes:
  postgres_data: