<main class="workspace-page page-content"><p><a routerLink="/devices">← Devices</a></p><h1>{{ id ? 'Edit device' : 'Add device' }}</h1><form [formGroup]="form" (ngSubmit)="submit()" class="card"><label>Name <input formControlName="name"></label><label>IP address <input formControlName="ipAddress"></label><label>Type <select formControlName="deviceType">@for (type of types; track type) {<option [value]="type">{{ type }}</option>}</select></label><label>Location <input formControlName="location"></label><label>Description <textarea formControlName="description"></textarea></label>@if(error()){<p>{{ error() }}</p>}<button class="primary-button" [disabled]="saving()">{{ saving() ? 'Saving…' : 'Save device' }}</button></form></main>
