<main class="workspace-page page-content"><p><a routerLink="/devices">← Devices</a></p><h1>Ping history</h1>@if(error()){<p>{{error()}}</p>}<section class="card"><table class="data-table"><thead><tr><th>CHECKED</th><th>STATUS</th><th>LATENCY</th></tr></thead><tbody>@for(point of points();track point.checkedAt){<tr><td>{{point.checkedAt | date:'medium'}}</td><td>{{point.isOnline ? 'Online' : 'Offline'}}</td><td>{{point.latencyMs ?? '—'}} ms</td></tr>}@empty{<tr><td colspan="3">No history available.</td></tr>}</tbody></table></section></main>
