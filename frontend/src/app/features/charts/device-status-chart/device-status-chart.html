<!-- Device Health -->
<article class="
            rounded-2xl
            border border-[#e8ebf2]
            bg-white p-5
            shadow-[0_2px_10px_rgba(20,30,50,0.025)]
            sm:p-6
          ">
  <div>
    <h3 class="font-['Outfit'] text-base font-bold text-[#172033]">
      Device Health
    </h3>
    <p class="mt-1 text-xs text-[#9aa3b5]">
      Current device status
    </p>
  </div>
  <div class="mt-6 flex items-center justify-center">
    <div class="relative h-48 w-48">
      <svg class="h-full w-full -rotate-90" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke-width="12" class="donut-bg" />
        <circle cx="50" cy="50" r="40" fill="none" stroke-width="12" stroke-linecap="round" class="donut-online"
          [attr.stroke-dasharray]="deviceHealth.onlineDash" />
        <circle cx="50" cy="50" r="40" fill="none" stroke-width="12" stroke-linecap="round" class="donut-warning"
          [attr.stroke-dasharray]="deviceHealth.warningDash" [attr.stroke-dashoffset]="deviceHealth.warningOffset" />
        <circle cx="50" cy="50" r="40" fill="none" stroke-width="12" stroke-linecap="round" class="donut-offline"
          [attr.stroke-dasharray]="deviceHealth.offlineDash" [attr.stroke-dashoffset]="deviceHealth.offlineOffset" />
      </svg>
      <div class="
                  absolute inset-0
                  flex flex-col
                  items-center justify-center
                ">
        <span class="
                    font-['Outfit']
                    text-3xl font-bold
                    text-[#172033]
                  ">
          {{ onlinePercentage() }}%
        </span>
        <span class="text-xs text-[#9aa3b5]">
          Healthy
        </span>
      </div>
    </div>
  </div>
  <!-- Legend -->
  <div class="mt-5 space-y-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-[#32a866]"></span>
        <span class="text-xs font-semibold text-[#657087]">
          Online
        </span>
      </div>
      <span class="text-xs font-bold text-[#263247]">
        {{ onlineDevices() }}
      </span>
    </div>
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-[#f3a54a]"></span>
        <span class="text-xs font-semibold text-[#657087]">
          Warning
        </span>
      </div>
      <span class="text-xs font-bold text-[#263247]">
        {{ warningDevices() }}
      </span>
    </div>
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="h-2.5 w-2.5 rounded-full bg-[#ff6675]"></span>
        <span class="text-xs font-semibold text-[#657087]">
          Offline
        </span>
      </div>
      <span class="text-xs font-bold text-[#263247]">
        {{ offlineDevices() }}
      </span>
    </div>
  </div>
</article>
