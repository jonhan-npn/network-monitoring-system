<!-- Performance -->
<article class="
            min-w-0 rounded-2xl
            border border-[#e8ebf2]
            bg-white p-5
            shadow-[0_2px_10px_rgba(20,30,50,0.025)]
            sm:p-6
          ">
    <div class="
              flex flex-col gap-4
              sm:flex-row sm:items-start sm:justify-between
            ">
        <div>
            <h3 class="font-['Outfit'] text-base font-bold text-[#172033]">
                Network Performance
            </h3>
            <p class="mt-1 text-xs text-[#9aa3b5]">
                Average response time across monitored devices
            </p>
        </div>
        <!-- Range -->
        <div class="
                flex w-fit rounded-lg
                bg-[#f5f7fa]
                p-1
              ">
            @for (range of timeRanges; track range) {
            <button type="button" (click)="selectRange(range)" class="
                    rounded-md px-3 py-1.5
                    text-[11px] font-bold
                    text-[#8c96a8]
                    transition
                  " [class.bg-white]="selectedRange() === range" [class.text-[#4f7cff]]="selectedRange() === range"
                [class.shadow-sm]="selectedRange() === range">
                {{ range }}
            </button>
            }
        </div>
    </div>
    <!-- SVG chart -->
    <div class="mt-6 overflow-hidden">
        <svg class="performance-chart h-auto w-full" viewBox="0 0 800 300" preserveAspectRatio="none">
            <defs>
                <linearGradient id="performanceGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-opacity=".18" />
                    <stop offset="100%" stop-opacity="0" />
                </linearGradient>
            </defs>
            <!-- Grid -->
            <line x1="0" y1="50" x2="800" y2="50" />
            <line x1="0" y1="110" x2="800" y2="110" />
            <line x1="0" y1="170" x2="800" y2="170" />
            <line x1="0" y1="230" x2="800" y2="230" />
            <!-- Area -->
            <path class="chart-area" d="
                  M0 190
                  C60 180 90 150 140 165
                  C190 180 220 130 270 145
                  C320 160 350 100 400 120
                  C450 140 480 80 530 105
                  C580 130 610 90 660 100
                  C710 110 750 75 800 90
                  L800 300
                  L0 300
                  Z
                " />
            <!-- Line -->
            <path class="chart-line" d="
                  M0 190
                  C60 180 90 150 140 165
                  C190 180 220 130 270 145
                  C320 160 350 100 400 120
                  C450 140 480 80 530 105
                  C580 130 610 90 660 100
                  C710 110 750 75 800 90
                " />
        </svg>
    </div>
    <div class="
              mt-2 flex justify-between
              text-[10px] font-medium
              text-[#a1a9b8]
            ">
        <span>00:00</span>
        <span>04:00</span>
        <span>08:00</span>
        <span>12:00</span>
        <span>16:00</span>
        <span>20:00</span>
        <span>24:00</span>
    </div>
</article>
