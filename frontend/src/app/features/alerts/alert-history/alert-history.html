<main class="workspace-page page-content"><p><a routerLink="/alerts/rules">← Alert rules</a></p><h1>Alert history</h1>@if(error()){<p>{{error()}}</p>}<section class="card"><table class="data-table"><thead><tr><th>TIME</th><th>RULE</th><th>DEVICE</th><th>MESSAGE</th><th>CHANNEL</th></tr></thead><tbody>@for(item of history();track item.id){<tr><td>{{item.triggeredAt | date:'medium'}}</td><td>{{item.ruleName}}</td><td>{{item.deviceName || 'All devices'}}</td><td>{{item.message}}</td><td>{{item.channel}}</td></tr>}@empty{<tr><td colspan="5">No alerts have been sent.</td></tr>}</tbody></table></section></main>
