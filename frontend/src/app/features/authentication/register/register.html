<div class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <span class="ping-dot" aria-hidden="true"></span>
      <span class="brand-name">NetWatch</span>
    </div>
    <h1>Create your account</h1>
    <p class="subtitle">Start monitoring devices in minutes.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="field">
        <span class="field-label">Username</span>
        <input type="text" formControlName="username" autocomplete="username" placeholder="jane.doe" />
        @if (username.invalid && username.touched) {
          <span class="field-error">Username must be at least 3 characters.</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" formControlName="email" autocomplete="email" placeholder="you@company.com" />
        @if (email.invalid && email.touched) {
          <span class="field-error">Enter a valid email address.</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" formControlName="password" autocomplete="new-password" placeholder="••••••••" />
        @if (password.invalid && password.touched) {
          <span class="field-error">Password must be at least 6 characters.</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Confirm password</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" placeholder="••••••••" />
        @if (form.errors?.['passwordMismatch'] && confirmPassword.touched) {
          <span class="field-error">Passwords do not match.</span>
        }
      </label>

      @if (errorMessage()) {
        <div class="form-error" role="alert">{{ errorMessage() }}</div>
      }

      <button type="submit" class="submit-btn" [disabled]="isLoading()">
        {{ isLoading() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="switch-link">
      Already have an account? <a routerLink="/auth/login">Sign in</a>
    </p>
  </div>
</div>
