<div class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <span class="ping-dot" aria-hidden="true"></span>
      <span class="brand-name">NetWatch</span>
    </div>
    <h1>Sign in</h1>
    <p class="subtitle">Monitor your network from one place.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="field">
        <span class="field-label">Username</span>
        <input
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="Your username"
        />
        @if (username.invalid && username.touched) {
          <span class="field-error">Enter your username.</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        @if (password.invalid && password.touched) {
          <span class="field-error">Password must be at least 6 characters.</span>
        }
      </label>

      @if (errorMessage()) {
        <div class="form-error" role="alert">{{ errorMessage() }}</div>
      }

      <button type="submit" class="submit-btn" [disabled]="isLoading()">
        {{ isLoading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="switch-link">
      No account yet? <a routerLink="/auth/register">Create one</a>
    </p>
  </div>
</div>
